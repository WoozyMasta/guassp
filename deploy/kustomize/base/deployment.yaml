---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guassp

spec:
  strategy:
    type: Recreate

  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: guassp
          image: ghcr.io/woozymasta/guassp:latest
          workingDir: /config

          envFrom:
            - secretRef:
                name: guassp-secrets
                optional: true

          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: config
          configMap:
            name: guassp-config
            optional: true
